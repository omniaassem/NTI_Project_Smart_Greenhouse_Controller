<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <rect x="30" y="30" width="1140" height="640" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Smart Greenhouse Wiring Diagram</text>

  <!-- ATmega32A -->
  <rect x="470" y="180" width="220" height="260" rx="18" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="580" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">ATmega32A</text>
  <text x="580" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">Central MCU</text>
  <text x="520" y="280" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA0</text>
  <text x="520" y="315" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA1</text>
  <text x="520" y="350" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA2</text>
  <text x="520" y="385" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA3</text>
  <text x="520" y="420" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA4</text>
  <text x="520" y="455" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA5</text>
  <text x="520" y="490" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA6</text>
  <text x="520" y="525" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PA7</text>
  <text x="680" y="280" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC0</text>
  <text x="680" y="315" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC1</text>
  <text x="680" y="350" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC2</text>
  <text x="680" y="385" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC3</text>
  <text x="680" y="420" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC4</text>
  <text x="680" y="455" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC5</text>
  <text x="680" y="490" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC6</text>
  <text x="680" y="525" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">PC7</text>
  <text x="520" y="565" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">GND</text>
  <text x="680" y="565" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">VCC</text>

  <!-- Sensors -->
  <rect x="900" y="140" width="220" height="200" rx="18" fill="#f0fdfa" stroke="#10b981" stroke-width="2"/>
  <text x="1010" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#065f46">Sensors</text>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="14">
    <text x="935" y="205">Temp Sensor</text>
    <text x="935" y="235">A0 / PA0</text>
    <text x="935" y="285">Soil Sensor</text>
    <text x="935" y="315">A1 / PA1</text>
    <text x="935" y="365">Light Sensor</text>
    <text x="935" y="395">A2 / PA2</text>
  </g>

  <rect x="130" y="140" width="220" height="240" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">Outputs</text>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="14">
    <text x="170" y="220">Fan / Pump</text>
    <text x="170" y="250">via L298P driver</text>
    <text x="170" y="300">Lamp PB2</text>
    <text x="170" y="340">Alarm LED PB3</text>
    <text x="170" y="380">Buzzer PD7</text>
  </g>

  <rect x="880" y="380" width="240" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1000" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5b21b6">EEPROM</text>
  <text x="1000" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">SPI 25LC256</text>

  <rect x="450" y="70" width="300" height="90" rx="18" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9d174d">LCD</text>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">AIP31068 I2C 16×2</text>
  <text x="540" y="145" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">SDA / PC1</text>
  <text x="660" y="145" font-family="Arial, sans-serif" font-size="14" fill="#0f172a">SCL / PC0</text>

  <rect x="120" y="420" width="360" height="160" rx="18" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
  <text x="300" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Buttons</text>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="14">
    <text x="160" y="490">Alarm Reset PD2</text>
    <text x="160" y="520">Mode PD3</text>
    <text x="160" y="550">Save PD4</text>
  </g>

  <rect x="520" y="520" width="180" height="90" rx="18" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="610" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9f1239">UART</text>
  <text x="610" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">TX / PD1, RX / PD0</text>

  <!-- Connections -->
  <line x1="550" y1="340" x2="900" y2="240" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="550" y1="360" x2="900" y2="420" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="550" y1="380" x2="900" y2="350" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="160" x2="690" y2="230" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="550" y1="430" x2="600" y2="430" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="550" y1="455" x2="600" y2="555" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="450" y1="395" x2="350" y2="325" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="450" y1="425" x2="350" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="450" y1="455" x2="350" y2="390" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="510" x2="300" y2="510" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="450" y1="540" x2="600" y2="540" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="600" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">ATmega32A-based greenhouse controller wiring for sensors, actuators, LCD, EEPROM, and UART</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
